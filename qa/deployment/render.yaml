# qa/deployment/render.yaml — Render Deployment Blueprint
#
# Render Blueprint for the FastAPI backend. Deploy: connect the repo in the
# Render dashboard and it will pick this up, or use `render blueprint launch`.
# All secrets are set in the Render dashboard's Environment tab — never in
# this file.

services:
  - type: web
    name: learning-path-recommender-backend
    runtime: python
    # No rootDir — requirements.txt now lives at the repo root, and backend/
    # is started with an explicit app-dir so its relative imports still work.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/auto
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_NIM_MODEL
        value: meta/llama-3.2-11b-vision-instruct
      - key: CORS_ORIGINS
        sync: false
